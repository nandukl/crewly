<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Log In | SovereignSuite</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "primary": "#0f172a", // Navy
                      "secondary": "#3b82f6", // Action Blue
                      "on-background": "#0f172a",
                      "background": "#f8f9ff",
                      "surface": "#ffffff",
                      "outline": "#e2e8f0",
                      "outline-variant": "#cbd5e1",
                      "on-surface-variant": "#64748b",
                      "surface-container": "#f1f5f9"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "container-max": "1440px",
                      "xl": "32px",
                      "md": "16px",
                      "lg": "24px",
                      "sm": "8px",
                      "xs": "4px",
                      "2xl": "48px"
              },
              "fontFamily": {
                      "headline-lg": ["Geist", "sans-serif"],
                      "body-md": ["Inter", "sans-serif"],
                      "label-md": ["Geist", "sans-serif"],
                      "title-lg": ["Inter", "sans-serif"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "16px", "fontWeight": "500"}],
                      "title-lg": ["16px", {"lineHeight": "24px", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
<style>
        body {
            background-color: #f8f9ff;
        }
        .login-card {
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
        }
        input:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 1px #3b82f6 !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-md font-body-md text-primary">
<main class="w-full max-w-[480px] flex flex-col items-center">
<!-- Brand Presence -->
<div class="mb-12 text-center">
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Welcome Back</h1>
</div>
<!-- Login Card -->
<div class="w-full bg-surface login-card border border-outline rounded-lg p-xl">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-primary block" for="email">Email Address</label>
<input class="w-full px-md py-[10px] bg-white border border-outline rounded-lg font-body-md text-primary placeholder:text-on-surface-variant focus:outline-none transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
<!-- Password Field -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-primary block" for="password">Password</label>
<input class="w-full px-md py-[10px] bg-white border border-outline rounded-lg font-body-md text-primary placeholder:text-on-surface-variant focus:outline-none transition-all" id="password" name="password" placeholder="••••••••" required="" type="password">
<div class="flex justify-end">
<a class="text-[13px] text-secondary hover:underline font-medium" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit CTA -->
<div class="pt-2">
<button class="w-full py-md px-lg bg-secondary text-white font-title-lg text-title-lg rounded-lg hover:bg-blue-600 transition-all flex items-center justify-center" type="submit">
                    Log In
                </button>
</div>
<!-- Sign Up Link -->
<div class="text-center pt-xl">
<p class="font-body-md text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-secondary font-semibold hover:underline ml-xs" href="#">Sign up</a>
</p>
</div>
</form>
</div>
<!-- System Footer -->
<footer class="mt-xl text-center">
<div class="flex flex-col items-center gap-sm">
<div class="flex items-center gap-2 mb-2">
<div class="w-6 h-6 bg-primary flex items-center justify-center rounded">
<span class="material-symbols-outlined text-white text-[16px]" style="font-variation-settings: 'FILL' 1;">shield_person</span>
</div>
<span class="font-headline-lg text-[18px] tracking-tight text-primary">Crewly</span>
</div>
<p class="text-[12px] text-on-surface-variant opacity-60">© 2024 Crewly Inc. v4.2.0-stable</p>
</div>
</footer>
</main>
<script>
    // Form submission animation simulation
    document.querySelector('form').addEventListener('submit', (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button');
        const originalText = btn.innerText;
        btn.disabled = true;
        btn.innerHTML = `
            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="ml-2">Authenticating...</span>
        `;
        
        setTimeout(() => {
            btn.innerHTML = `
                <span class="material-symbols-outlined text-[20px] mr-2">check_circle</span>
                Access Granted
            `;
            btn.classList.replace('bg-secondary', 'bg-green-600');
        }, 1500);
    });
</script>


</body></html>
